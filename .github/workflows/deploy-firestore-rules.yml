name: Deploy Firestore rules

# Keeps the live Firebase project's security rules in sync with this repo
# automatically — without this, editing firestore.rules here (even merging
# it to main) has NO effect on the real game until someone manually runs
# `firebase deploy --only firestore:rules`. That gap is what caused
# training certain professions to fail with a Firestore "insufficient
# permissions" error even though the rules in this repo were already
# correct: they'd just never been pushed to the live project.
#
# Requires one manual one-time setup step (can't be done from a CI run):
# a repo secret named FIREBASE_SERVICE_ACCOUNT holding a Firebase service
# account JSON key with Firestore rules deploy permission. Generate one at
# https://console.firebase.google.com/project/_/settings/serviceaccounts/adminsdk
# then add it at Settings > Secrets and variables > Actions in this repo.
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g firebase-tools
      - run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: firebase deploy --only firestore:rules,firestore:indexes --project world-unraveled --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
